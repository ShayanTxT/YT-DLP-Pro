name: Release

# Push a tag like v2.0.0 -> builds the Windows EXE and the Linux binary,
# then attaches both to a GitHub Release. Also runnable manually (artifacts only).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --console --name "YT-DLP-Pro" --collect-all yt_dlp --collect-all textual --hidden-import ytd_tui yt_downloader.py
      - name: Smoke-test
        run: .\dist\YT-DLP-Pro.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: YT-DLP-Pro-windows
          path: dist/YT-DLP-Pro.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build binary
        run: bash build.sh
      - name: Smoke-test
        run: ./dist/ytd-linux-x86_64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: ytd-linux-x86_64
          path: dist/ytd-linux-x86_64

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/YT-DLP-Pro.exe
            artifacts/ytd-linux-x86_64
          generate_release_notes: true
