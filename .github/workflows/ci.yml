name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Byte-compile check
        run: python -m py_compile yt_downloader.py ytd_tui.py

      - name: Unit + TUI tests
        run: python -m pytest -q tests

      - name: CLI smoke tests
        run: |
          python yt_downloader.py --version
          python yt_downloader.py --help
          python yt_downloader.py --history
          python yt_downloader.py --subscriptions
