<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0033"/>
      <stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- play button logo -->
  <g transform="translate(70,72)">
    <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#accent)"/>
    <polygon points="44,32 44,88 92,60" fill="#ffffff"/>
  </g>

  <text x="225" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#f0f6fc">YT-DLP <tspan fill="#ff4d6d">Pro</tspan></text>
  <text x="228" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#8b949e">The YouTube downloader that works while you browse.</text>

  <!-- feature pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#f0f6fc">
    <g transform="translate(70,238)">
      <rect width="235" height="44" rx="22" fill="#21262d" stroke="#30363d"/>
      <text x="117" y="29" text-anchor="middle">Clipboard Watch</text>
    </g>
    <g transform="translate(320,238)">
      <rect width="200" height="44" rx="22" fill="#21262d" stroke="#30363d"/>
      <text x="100" y="29" text-anchor="middle">Clip + GIF Maker</text>
    </g>
    <g transform="translate(535,238)">
      <rect width="210" height="44" rx="22" fill="#21262d" stroke="#30363d"/>
      <text x="105" y="29" text-anchor="middle">Smart Size Preview</text>
    </g>
    <g transform="translate(760,238)">
      <rect width="175" height="44" rx="22" fill="#21262d" stroke="#30363d"/>
      <text x="87" y="29" text-anchor="middle">SponsorBlock</text>
    </g>
    <g transform="translate(950,238)">
      <rect width="180" height="44" rx="22" fill="#21262d" stroke="#30363d"/>
      <text x="90" y="29" text-anchor="middle">Channel Sync</text>
    </g>
  </g>

  <text x="1130" y="320" text-anchor="end" font-family="Consolas, monospace" font-size="16" fill="#484f58">$ ytd --watch</text>
</svg>
